[project]
name = "pitchlist-backend"
version = "0.1.0"
description = "Pitchlist backend: data layer, core logic, API and MCP server"
requires-python = ">=3.11"
# Shared manifest: minimal edit, own commit, push right away (CLAUDE.md rule 3).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# contracts/ lives at the repo root; the editable install maps it in so
# `from contracts.schemas import ...` works from anywhere.
packages = ["data", "cache", "batch", "core", "agent", "mcp_server", "api", "contracts"]

[tool.setuptools.package-dir]
contracts = "../contracts"

[tool.pytest.ini_options]
# "." = backend/ (data, core, api, ...), ".." = repo root (contracts)
pythonpath = [".", ".."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.isort]
known-first-party = ["contracts", "data", "cache", "batch", "core", "agent", "mcp_server", "api"]
